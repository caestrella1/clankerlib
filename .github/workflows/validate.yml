name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate library
        run: python3 scripts/validate.py
      - name: Smoke-test install script
        run: |
          scripts/install.sh --dest "$RUNNER_TEMP/skills" --all
          test -f "$RUNNER_TEMP/skills/code-review/SKILL.md"
